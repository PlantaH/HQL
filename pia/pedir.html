<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Inteligente de Productos</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        p {
            color: #666;
            font-size: 0.95rem;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #a0c4ff;
            cursor: not-allowed;
        }
        #loading {
            display: none;
            margin-top: 15px;
            color: #007bff;
            font-weight: bold;
            text-align: center;
        }
        #resultados {
            margin-top: 25px;
        }
        .producto-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 4px solid #28a745;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .producto-nombre {
            font-weight: bold;
            color: #333;
        }
        .producto-precio {
            color: #28a745;
            font-weight: bold;
        }
        .producto-stock {
            font-size: 0.85rem;
            color: #777;
        }
        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

 
<div class="card">
    <h2>Buscador de Productos con IA</h2>
      <p>Escribe lo que necesitas en texto libre (ej: <i>"Quiero comprar fideos, salsa de tomate y queso rallado"</i>):</p>
    <label for="texto">Escribe lo que necesitas comprar:</label>
    <textarea id="texto" rows="4" placeholder=""></textarea>
    
    <button type="button" id="btnSubmit" onclick="enviarConsulta()">Buscar Productos</button>

    <div id="resultado" style="margin-top: 20px;"></div>
</div>

<script>
async function enviarConsulta() {
    const textoInput = document.getElementById('texto').value.trim();
    const btnSubmit = document.getElementById('btnSubmit');
    const resultadoDiv = document.getElementById('resultado');

    if (!textoInput) {
        alert("Por favor, ingresa lo que deseas comprar.");
        return;
    }

    // Estado de carga
    btnSubmit.disabled = true;
    resultadoDiv.innerHTML = "<p><i>Procesando con IA y buscando en la base de datos...</i></p>";

    try {
        // Formatear los datos para que ASP Classic los lea con Request.Form
        const formData = new URLSearchParams();
        formData.append('texto', textoInput);

        const response = await fetch('procesargroq.asp', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
            },
            body: formData.toString()
        });

        const data = await response.text();
        resultadoDiv.innerHTML = data;

    } catch (error) {
        resultadoDiv.innerHTML = "<p style='color:red;'>Error al procesar la solicitud.</p>";
        console.error("Error:", error);
    } finally {
        btnSubmit.disabled = false;
    }
}
</script>

</body>
</html>
