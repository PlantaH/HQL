<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Firma</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      padding: 20px;
    }
    .signature-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    canvas {
      border: 2px dashed #cccccc;
      border-radius: 4px;
      touch-action: none; /* Evita que la pantalla se mueva al firmar en celulares */
      background-color: #ffffff;
      cursor: crosshair;
      width: 100%;
      height: 200px;
    }
    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-clear { background-color: #e74c3c; color: white; }
    .btn-save { background-color: #2ecc71; color: white; }
  </style>
</head>
<body>

  <div class="signature-container">
    <h2>Firme aquí</h2>
    <canvas id="signatureCanvas"></canvas>
    <div class="actions">
      <button type="button" class="btn-clear" id="btnClear">Limpiar</button>
      <button type="button" class="btn-save" id="btnSave">Guardar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    const btnClear = document.getElementById('btnClear');
    const btnSave = document.getElementById('btnSave');

    let isDrawing = false;

    // Ajustar resolución del canvas
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000000';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    // Eventos Mouse
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Eventos Táctiles (Celulares / Tablets)
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    // Limpiar canvas
    btnClear.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // Guardar vía XHR (XMLHttpRequest) hacia el archivo .asp
    btnSave.addEventListener('click', () => {
      const dataURL = canvas.toDataURL('image/png');

      // Validar si el canvas está vacío (opcional, verificando si hay trazos)
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'guardar_firma.asp', true);
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              const res = JSON.parse(xhr.responseText);
              if (res.success) {
                alert('¡Firma guardada con éxito!');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
              } else {
                alert('Error del servidor: ' + res.message);
              }
            } catch (e) {
              alert('Respuesta inesperada del servidor.');
            }
          } else {
            alert('Error HTTP al conectar con el servidor.');
          }
        }
      };

      // Se envía codificado para evitar problemas con caracteres especiales en URL/POST
      xhr.send('firma=' + encodeURIComponent(dataURL));
    });
  </script>

</body>
</html>
